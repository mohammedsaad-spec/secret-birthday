<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thodi Der Aur Theher Ja ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* OPENING SCREEN */

    .opening {
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at center, #242424 0%, #0c0c0c 45%, #000 100%);
      position: relative;
    }

    .opening-content {
      max-width: 500px;
    }

    .line {
      opacity: 0;
      transform: translateY(15px);
      animation: appear 2s ease forwards;
    }

    .line1 {
      font-size: 22px;
      animation-delay: 1s;
    }

    .line2 {
      font-size: 18px;
      color: #cfcfcf;
      margin-top: 28px;
      animation-delay: 4s;
    }

    .line3 {
      font-size: 26px;
      margin-top: 35px;
      font-style: italic;
      color: #f5d7dc;
      animation-delay: 7s;
    }

    .heart {
      font-size: 25px;
      margin-top: 18px;
      opacity: 0;
      animation:
        appear 2s ease forwards 9s,
        heartbeat 1.5s ease-in-out infinite 11s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }
    }

    /* CONTINUE BUTTON */

    .continue {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      animation: appear 2s ease forwards 11s;
      color: #ddd;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .arrow {
      display: block;
      font-size: 20px;
      margin-top: 8px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(7px);
      }
    }

    /* PHOTO SECTION */

    .memories {
      min-height: 100vh;
      padding: 80px 20px;
      text-align: center;
      background: #0b0b0b;
    }

    .memories h1 {
      font-size: 27px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    .memories p {
      color: #aaa;
      margin-bottom: 45px;
    }

    .photo {
      width: 90%;
      max-width: 420px;
      margin: 0 auto 55px;
      opacity: 0;
      transform: translateY(30px);
      animation: photoAppear 1.5s ease forwards;
    }

    .photo img {
      width: 100%;
      border-radius: 14px;
      display: block;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    @keyframes photoAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HIDDEN UNTIL CONTINUE */

    #memories {
      display: none;
    }

  </style>
</head>

<body>

  <!-- OPENING -->

  <section class="opening">

    <div class="opening-content">

      <div class="line line1">
        Hey…
      </div>

      <div class="line line2">
        Before you scroll…
      </div>

      <div class="line line3">
        Thodi der aur theher ja…
      </div>

      <div class="heart">
        ❤️
      </div>

    </div>

    <div class="continue" onclick="showMemories()">
      CONTINUE
      <span class="arrow">↓</span>
    </div>

  </section>


  <!-- MEMORIES -->

  <section class="memories" id="memories">

    <h1>A little something for you…</h1>

    <p>Some moments are worth staying for.</p>


    <!-- PHOTO 1 -->

    <div class="photo">
      <img src="photo1.jpg" alt="Our memory">
    </div>


    <!-- PHOTO 2 -->

    <div class="photo">
      <img src="photo2.jpg" alt="Our memory">
    </div>


    <!-- PHOTO 3 -->

    <div class="photo">
      <img src="photo3.jpg" alt="Our memory">
    </div>


    <!-- PHOTO 4 -->

    <div class="photo">
      <img src="photo4.jpg" alt="Our memory">
    </div>


    <!-- PHOTO 5 -->

    <div class="photo">
      <img src="photo5.jpg" alt="Our memory">
    </div>


    <!-- PHOTO 6 -->

    <div class="photo">
      <img src="photo6.jpg" alt="Our memory">
    </div>

  </section>


  <script>

    function showMemories() {

      const memories = document.getElementById("memories");

      memories.style.display = "block";

      setTimeout(() => {
        memories.scrollIntoView({
          behavior: "smooth"
        });
      }, 100);

    }

  </script>

</body>
</html>
