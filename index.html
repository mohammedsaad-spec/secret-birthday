<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just For You</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 35%, #211822 0%, #0d0b10 42%, #050507 100%);
    color: #f7f0eb;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
}

/* Stars */

.star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.35;
    animation: twinkle 3s infinite;
}

@keyframes twinkle {
    50% {
        opacity: 0.08;
        transform: scale(0.5);
    }
}

/* Main */

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.content {
    text-align: center;
    max-width: 700px;
    width: 100%;

    opacity: 0;
    transform: translateY(20px);

    animation: appear 1.8s ease forwards;
}

@keyframes appear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Small heading */

.subtitle {
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #aaa1a0;

    margin-bottom: 30px;
}

/* Main heading */

h1 {
    font-size: clamp(50px, 13vw, 90px);
    font-weight: normal;
    margin: 0 0 25px;
}

/* Message */

.message {
    font-size: clamp(18px, 4.5vw, 25px);
    line-height: 1.7;
    color: #ddd5d1;

    min-height: 80px;
}

/* Countdown */

.countdown {
    display: flex;
    justify-content: center;

    gap: clamp(12px, 4vw, 30px);

    margin: 45px 0 35px;
}

.number {
    font-family: Arial, sans-serif;
    font-size: clamp(30px, 8vw, 55px);
    font-weight: 400;
}

.label {
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: #888080;

    margin-top: 8px;
}

/* Button */

button {
    background: transparent;

    border: 1px solid #665153;

    color: #eee5e1;

    padding: 14px 25px;

    border-radius: 50px;

    font-family: Arial, sans-serif;

    cursor: pointer;

    transition: all 0.35s ease;
}

button:hover {
    background: #ead1c8;
    color: #171216;

    transform: translateY(-2px);
}

/* Reply */

.reply {
    margin-top: 25px;

    font-size: 18px;

    color: #d9a99b;

    min-height: 30px;
}

/* Footer */

.footer {
    position: fixed;

    bottom: 18px;

    left: 0;
    right: 0;

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: #666064;
}

</style>
</head>


<body>

<div class="container">

<div class="content">

<div class="subtitle" id="subtitle">
A little something for you
</div>

<h1 id="title">
Hey...
</h1>

<div class="message" id="message">
I made something for you.
<br>
But you're going to have to wait.
</div>


<!-- COUNTDOWN -->

<div class="countdown" id="countdown">

<div>
<div class="number" id="days">00</div>
<div class="label">DAYS</div>
</div>

<div>
<div class="number" id="hours">00</div>
<div class="label">HOURS</div>
</div>

<div>
<div class="number" id="minutes">00</div>
<div class="label">MINUTES</div>
</div>

<div>
<div class="number" id="seconds">00</div>
<div class="label">SECONDS</div>
</div>

</div>


<button id="button">
I'll wait ❤️
</button>

<div class="reply" id="reply"></div>

</div>

</div>


<div class="footer" id="footer">
COME BACK TOMORROW
</div>


<script>

/* -----------------------------------
   IMPORTANT DATES
----------------------------------- */

const startDate =
new Date("2026-09-15T00:00:00+05:30");

const birthday =
new Date("2026-09-19T00:00:00+05:30");


/* -----------------------------------
   DATE CHECK
----------------------------------- */

function checkDate() {

    const now = new Date();

    /* BEFORE SEPTEMBER 15 */

    if (now < startDate) {

        document.getElementById("subtitle")
        .innerText = "Not yet 👀";

        document.getElementById("title")
        .innerText = "Hey...";

        document.getElementById("message")
        .innerHTML =
        "You found this a little early.<br><br>" +
        "Come back on September 15.";

        document.getElementById("countdown")
        .style.display = "none";

        document.getElementById("button")
        .style.display = "none";

        document.getElementById("footer")
        .innerText = "SHHH...";

        return;

    }


    /* BIRTHDAY */

    if (now >= birthday) {

        birthdayMode();

        return;

    }


    /* NORMAL DAY */

    updateCountdown();

}


/* -----------------------------------
   COUNTDOWN
----------------------------------- */

function updateCountdown() {

    const now = new Date();

    const difference =
    birthday - now;

    if (difference <= 0) {

        birthdayMode();

        return;

    }


    const totalSeconds =
    Math.floor(difference / 1000);


    const days =
    Math.floor(totalSeconds / 86400);


    const hours =
    Math.floor(
        (totalSeconds % 86400) / 3600
    );


    const minutes =
    Math.floor(
        (totalSeconds % 3600) / 60
    );


    const seconds =
    totalSeconds % 60;


    document.getElementById("days")
    .innerText =
    String(days).padStart(2,"0");


    document.getElementById("hours")
    .innerText =
    String(hours).padStart(2,"0");


    document.getElementById("minutes")
    .innerText =
    String(minutes).padStart(2,"0");


    document.getElementById("seconds")
    .innerText =
    String(seconds).padStart(2,"0");

}


/* -----------------------------------
   BIRTHDAY MODE
----------------------------------- */

function birthdayMode() {

    document.getElementById("subtitle")
    .innerText =
    "19 • 09 • 2026";


    document.getElementById("title")
    .innerText =
    "Happy Birthday ❤️";


    document.getElementById("message")
    .innerHTML =
    "The wait is over.<br><br>" +
    "The rest of your surprise is waiting for you.";


    document.getElementById("countdown")
    .style.display = "none";


    document.getElementById("button")
    .innerText =
    "Open your surprise";


    document.getElementById("footer")
    .innerText =
    "TODAY IS YOUR DAY";

}


/* -----------------------------------
   BUTTON
----------------------------------- */

document.getElementById("button")
.addEventListener("click", function() {

    document.getElementById("reply")
    .innerText =
    "Good. Now go away. 😂";

});


/* -----------------------------------
   START
----------------------------------- */

checkDate();


setInterval(function() {

    checkDate();

}, 1000);


/* -----------------------------------
   CREATE STARS
----------------------------------- */

for(let i = 0; i < 40; i++) {

    const star =
    document.createElement("div");

    star.className = "star";

    star.style.left =
    Math.random() * 100 + "vw";

    star.style.top =
    Math.random() * 100 + "vh";

    star.style.animationDelay =
    Math.random() * 3 + "s";

    document.body.appendChild(star);

}

</script>

</body>
</html>
